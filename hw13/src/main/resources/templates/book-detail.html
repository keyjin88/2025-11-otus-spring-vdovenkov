<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Book Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-primary">
            <i class="fas fa-book"></i> <span th:text="${book.title}">Book Title</span>
        </h3>
        <a th:href="@{/}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> К списку
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Автор:</strong> <span th:text="${book.author.fullName}">Author</span></p>
            <p><strong>Жанр:</strong> <span th:text="${book.genre.name}">Genre</span></p>
            <div th:if="${isAdmin}">
                <a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">
                    <i class="fas fa-edit"></i> Редактировать книгу
                </a>
            </div>
        </div>
    </div>

    <h5 class="mb-3">Комментарии</h5>

    <div class="mb-4" th:if="${isAuthenticated}">
        <form th:action="@{/book/{id}/comment(id=${book.id})}" method="post" class="mb-3">
            <div class="input-group">
                <input type="text" name="text" class="form-control" placeholder="Добавить комментарий" required>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Добавить
                </button>
            </div>
        </form>
    </div>

    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-start" th:each="comment : ${comments}">
            <div class="ms-2 me-auto">
                <div class="fw-bold" th:text="${comment.comment}">Comment text</div>
                <small class="text-muted" th:if="${comment.ownerUsername}" th:text="'@' + ${comment.ownerUsername}">@user</small>
            </div>
            <div th:if="${isAuthenticated and (isAdmin or (comment.ownerUsername != null and comment.ownerUsername == currentUsername))}">
                <form th:action="@{/comment/{id}/delete(id=${comment.id})}" method="post" class="d-inline" onsubmit="return confirm('Удалить комментарий?');">
                    <input type="hidden" name="bookId" th:value="${book.id}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="fas fa-trash"></i>
                    </button>
                </form>
            </div>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(comments)}" class="text-muted mt-3">Комментариев пока нет.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
